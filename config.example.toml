# Copy to config.toml and fill in the keys. Any key can also be set as an
# environment variable instead, e.g. TWITCH_CLIENT_ID, YOUTUBE_API_KEY.

[discovery]
game = "Grand Theft Auto VI"                      # Twitch/Kick category name
search_terms = ["GTA 6", "GTA VI", "Grand Theft Auto VI"]  # YouTube search
top_n = 10                                       # how many streams to track
min_viewers = 500
platforms = ["twitch", "youtube", "kick"]
refresh_seconds = 300                            # re-rank every 5 min
youtube_refresh_seconds = 900                    # YouTube quota: keep >= 900
always_track = []                                # e.g. ["twitch:kaicenat", "kick:adinross"]
languages = ["en"]                               # only English streams; [] = any language
                                                 # (clips where the streamer clearly speaks another language go to clips/other-languages)

[detector]
short_window = 5        # seconds that count as "right now"
baseline_window = 300   # seconds that count as "normal"
multiplier = 3.0        # chat must be 3x normal...
min_zscore = 4.0        # ...and clearly outside normal variation...
min_rate = 2.0          # ...and at least 2 msgs/sec
warmup = 60             # learn a channel's normal for 60 s before clipping
cooldown = 90           # at most one clip per channel per 90 s

[clips]
output_dir = "clips"
buffer_dir = "buffer"
pre_roll = 22           # seconds kept before chat explodes
post_roll = 8           # seconds kept after it (22 + 8 = a 30-second clip)
chat_delay = 0          # raise if clips start too late (stream delay)
segment_seconds = 2
quality = "best"        # or "720p", "480p" to save disk/bandwidth
keep_originals = false  # true keeps the 16:9 originals (in <Streamer>/Originals) after the phone version

[twitch]   # https://dev.twitch.tv/console/apps  → Register, "Confidential"
client_id = ""
client_secret = ""

[youtube]  # Google Cloud console → enable "YouTube Data API v3" → API key
api_key = ""

[kick]     # https://kick.com/settings/developer → create app
client_id = ""
client_secret = ""
category_id = 0         # set if Kick names the GTA 6 category differently

[vertical]              # phone version (9:16) with captions, made for every clip
enabled = true
layout = "blur"         # "blur": whole frame over a blurred background; "crop": fill the screen
speech_captions = true  # word-by-word captions of what the streamer says (local Whisper)
whisper_model = "small" # "base" is faster, "medium" more accurate
ai_captions = true      # Claude watches the clip and writes the hook + reaction captions
                        # (needs ANTHROPIC_API_KEY; falls back to chat-based captions without it)
ai_model = "claude-opus-5-5"   # best captions, ~3-5 cents per clip
                               # cheaper: "claude-haiku-5-5" (~0.1 cent per clip)
font = "Arial"
crf = 21
max_parallel = 1

[post]                  # drop clips into the POST folder to be walked through posting them
folder = "POST"
platforms = ["tiktok", "youtube", "instagram"]
credit = true           # name the streamer and platform in every caption
autofill = true         # Post fills in video + caption in Clipper's browser window; you click Post
autosubmit = false      # true: Clipper clicks Post/Publish/Share too (the sites forbid bots: account risk)
pause_between_clips = 120   # seconds between clips when it posts by itself

[phone]                 # the phone app for posting clips from the POST folder (menu option 8)
enabled = true
port = 8765
key = ""                # filled in automatically: the secret in the QR code
public_url = ""         # optional: a Tailscale https:// address for posting away from home

[anthropic]  # optional: https://console.anthropic.com → API Keys. Lets Claude write the captions.
api_key = ""
