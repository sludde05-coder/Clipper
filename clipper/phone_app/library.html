<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clipper</title>
<link rel="manifest" href="{{MANIFEST}}">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clipper">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --card2: #20242d; --line: #2a2f3a;
    --text: #f2f4f8; --muted: #9aa3b2; --accent: #7c5cff; --accent2: #9b82ff;
    --ok: #2ecc71; --warn: #f5a623;
    --tiktok: #fe2c55; --youtube: #ff0033; --instagram: #d62976;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; position: sticky; top: 0;
    background: var(--bg); z-index: 5; }
  header h1 { font-size: 22px; margin: 0; flex: 1; letter-spacing: -0.02em; }
  .iconbtn { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 12px;
    height: 40px; min-width: 40px; padding: 0 12px; font-size: 15px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  .list { display: grid; gap: 12px; }
  .clip { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 10px; text-align: left; color: inherit; width: 100%; font: inherit; }
  .clip img { width: 74px; height: 132px; object-fit: cover; border-radius: 10px; background: #000; flex: none; }
  .clip .info { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .clip .hook { font-weight: 650; font-size: 16px; }
  .clip .who { color: var(--muted); font-size: 14px; }
  .dots { display: flex; gap: 6px; margin-top: auto; flex-wrap: wrap; }
  .dot { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--card2); color: var(--muted); }
  .dot.done { background: rgba(46, 204, 113, .15); color: var(--ok); }

  .empty, .error { text-align: center; padding: 48px 12px; color: var(--muted); }
  .empty b, .error b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }

  .player { width: 100%; max-height: 62vh; background: #000; border-radius: 16px; display: block; }
  .title { font-size: 19px; font-weight: 700; margin: 14px 0 2px; }
  .platform { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px;
    margin-top: 12px; }
  .platform h2 { margin: 0 0 10px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .platform h2 .badge { width: 10px; height: 10px; border-radius: 50%; }
  .platform h2 .state { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--muted); }
  .platform.posted { border-color: rgba(46, 204, 113, .5); }
  .platform.posted h2 .state { color: var(--ok); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { flex: 1 1 140px; min-height: 46px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card2); color: var(--text); font: inherit; font-weight: 600; padding: 10px 12px;
    text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:disabled { opacity: .55; }
  .btn.good { background: rgba(46, 204, 113, .15); border-color: rgba(46, 204, 113, .5); color: var(--ok); }
  .caption { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
    margin: 10px 0; white-space: pre-wrap; font-size: 14px; color: #d7dbe3; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 10px; }
  .steps { margin: 10px 0 0; padding-left: 20px; color: var(--muted); font-size: 14px; }
  .steps li { margin: 3px 0; }
  .finish { margin-top: 18px; }
  .finish .btn { width: 100%; min-height: 54px; font-size: 17px; }
  .note { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    font-size: 13px; color: var(--muted); margin-top: 12px; }

  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom));
    background: #2b3040; color: var(--text); padding: 12px 14px; border-radius: 12px; font-size: 15px;
    box-shadow: 0 8px 30px rgba(0,0,0,.4); opacity: 0; transform: translateY(10px); transition: .2s;
    pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; transform: none; }
  [hidden] { display: none !important; }

  .tabs { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 10px; }
  .tabs button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 650; padding: 9px 6px; border-radius: 9px; }
  .tabs button.on { background: var(--card2); color: var(--text); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px;
    padding: 6px 12px; font: inherit; font-size: 14px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .clip { position: relative; }
  .clip.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .clip .tick { position: absolute; top: 14px; left: 14px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(0,0,0,.6); border: 2px solid #fff; display: grid; place-items: center; font-size: 14px; }
  .clip.sel .tick { background: var(--accent); border-color: var(--accent); }
  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; z-index: 10; }
  .actionbar .btn { flex: 1; }
  .btn.danger { color: #ff6b6b; border-color: rgba(255,107,107,.4); }
  textarea.caption { width: 100%; font: inherit; font-size: 14px; resize: vertical; min-height: 90px; }
  input.text { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; font: inherit; }
  .moment { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px; margin-top: 10px; }
  .moment .top { display: flex; gap: 10px; align-items: center; }
  .moment .rank { font-size: 26px; font-weight: 800; color: #ffd600; width: 48px; text-align: center; }
  .moment video { width: 100%; max-height: 50vh; background: #000; border-radius: 12px; margin-top: 8px; }
  .moment .times { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 8px; align-items: center; margin-top: 8px; }
  .moment .times input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px; font: inherit; }
  .moment .times .btn { flex: none; min-height: 40px; }
  .moment .moves { display: flex; gap: 6px; margin-left: auto; }
  .moment .moves .btn { flex: none; min-height: 38px; min-width: 44px; padding: 6px; }
  .parthead { margin: 18px 0 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .switchrow { display: flex; gap: 10px; align-items: center; margin-top: 12px; font-size: 15px; }
  .switchrow input { width: 22px; height: 22px; }
  .pad-bottom { height: 90px; }
</style>
</head>
<body>
<header>
  <button class="iconbtn" id="back" hidden aria-label="Back">‹ Back</button>
  <h1 id="heading">Clipper</h1>
  <button class="iconbtn" id="selectbtn">Select</button>
  <button class="iconbtn" id="refresh" aria-label="Refresh">↻</button>
</header>

<main id="view"></main>
<div class="actionbar" id="actionbar" hidden>
  <button class="btn danger" id="act-del">Delete</button>
  <button class="btn primary" id="act-top">🏆 Top 10</button>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  let KEY = qs.get("k") || "";
  try {
    if (KEY) localStorage.setItem("clipper-key", KEY); else KEY = localStorage.getItem("clipper-key") || "";
  } catch (e) {}

  const $ = s => document.querySelector(s);
  const view = $("#view"), heading = $("#heading"), backBtn = $("#back");
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const canShareFiles = (() => {
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File([""], "x.mp4", { type: "video/mp4" })] })); }
    catch (e) { return false; }
  })();
  const STEPS = {
    tiktok: ["Open TikTok and tap +", "Tap Upload and pick the video", "Tap Next, paste the caption", "Tap Post"],
    youtube: ["Open YouTube and tap +", "Pick the video (it becomes a Short)", "Paste the title", "Tap Upload"],
    instagram: ["Open Instagram, tap + and choose Reel", "Pick the video, tap Next", "Cover: Edit cover → Add from camera roll (Save cover first)", "Paste the caption, tap Share"],
  };
  const COLORS = { tiktok: "var(--tiktok)", youtube: "var(--youtube)", instagram: "var(--instagram)" };

  let platforms = [], clips = [], streamers = [];
  let tab = "todo", streamer = "", selecting = false, selected = new Set();
  let screen = "list";              // list | clip | top
  let current = null, fileCache = {}, comp = null;

  // ---------------------------------------------------------------- helpers
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const withKey = url => url + (url.includes("?") ? "&" : "?") + "k=" + encodeURIComponent(KEY);
  function toast(msg, ms = 2600) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms);
  }
  async function api(path, body) {
    const opts = { headers: { "X-Clipper-Key": KEY } };
    if (body !== undefined) Object.assign(opts, { method: "POST", body: JSON.stringify(body),
                                                 headers: { "X-Clipper-Key": KEY, "Content-Type": "application/json" } });
    const r = await fetch(path, opts);
    if (r.status === 403) throw Object.assign(new Error("key"), { kind: "key" });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
    return data;
  }
  async function copyText(text) {
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove(); return ok;
  }
  function go(name, push = true) {
    screen = name;
    backBtn.hidden = name === "list";
    $("#selectbtn").hidden = name !== "list";
    if (push && name !== "list") history.pushState({ s: name }, "", "#" + name);
    updateBar();
  }
  window.onpopstate = () => { if (screen !== "list") { stopVideos(); go("list", false); showList(); } };
  backBtn.onclick = () => history.back();
  function stopVideos() { view.querySelectorAll("video").forEach(v => v.pause()); }

  // ---------------------------------------------------------------- list
  async function showList() {
    heading.textContent = "Clipper";
    if (!KEY) {
      view.innerHTML = `<div class="error"><b>Connect to your PC</b>In the Clipper app on your PC, open the phone QR code and scan it with this phone's camera.</div>`;
      return;
    }
    let data;
    try {
      const info = await api("/api/info");
      platforms = info.platforms;
      data = await api("/lib/clips");
    } catch (e) {
      view.innerHTML = e.kind === "key"
        ? `<div class="error"><b>Scan the QR code again</b>The key doesn't match this PC anymore.</div>`
        : `<div class="error"><b>Can't reach your PC</b>Make sure Clipper is open on your PC and this phone is on the same Wi-Fi.</div>`;
      return;
    }
    clips = data.clips; streamers = data.streamers;
    for (const id of [...selected]) if (!clips.find(c => c.id === id)) selected.delete(id);
    renderList();
  }
  // Posted = posted on every platform you post to (like the PC app); until then it stays in To post.
  const isPosted = c => { const v = Object.values(c.posted); return v.length > 0 && v.every(Boolean); };
  function visible() {
    return clips.filter(c => (tab === "todo" ? !isPosted(c) : isPosted(c)) && (!streamer || c.streamer === streamer));
  }
  function renderList() {
    if (screen !== "list") return;
    const list = visible();
    view.innerHTML = `
      <div class="tabs"><button data-t="todo" class="${tab === "todo" ? "on" : ""}">To post (${clips.filter(c => !isPosted(c)).length})</button>
        <button data-t="posted" class="${tab === "posted" ? "on" : ""}">Posted</button>
        <button data-t="top">🏆 Top 10</button></div>
      <div class="chips"><button class="chip ${!streamer ? "on" : ""}" data-s="">All</button>${streamers.map(s =>
        `<button class="chip ${streamer === s.name ? "on" : ""}" data-s="${esc(s.name)}">${esc(s.name)}</button>`).join("")}</div>
      ${list.length ? `<div class="list">${list.map(c => `
        <button class="clip ${selected.has(c.id) ? "sel" : ""}" data-id="${esc(c.id)}">
          ${selecting ? `<span class="tick">${selected.has(c.id) ? "✓" : ""}</span>` : ""}
          <img src="${esc(withKey(c.thumb))}" alt="" loading="lazy">
          <div class="info">
            <div class="hook">${esc(c.hook || c.name)}</div>
            <div class="who">${esc(c.streamer)} · ${esc(c.date)} ${esc(c.time)}</div>
            <div class="dots">${platforms.map(p => `<span class="dot ${c.posted[p.key] ? "done" : ""}">${c.posted[p.key] ? "✓ " : ""}${esc(p.name.split(" ")[0])}</span>`).join("")}</div>
          </div></button>`).join("")}</div>`
      : `<div class="empty"><b>${tab === "todo" ? "Nothing to post" : "Nothing posted yet"}</b>${tab === "todo" ? "New clips show up here by themselves while Clipper is clipping on your PC." : ""}</div>`}
      <div class="pad-bottom"></div>`;
    view.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
      if (b.dataset.t === "top") return openTop(selecting && selected.size >= 2 ? [...selected] : []);
      tab = b.dataset.t; renderList();
    });
    view.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { streamer = b.dataset.s; renderList(); });
    view.querySelectorAll(".clip").forEach(b => b.onclick = () => {
      const id = b.dataset.id;
      if (selecting) { selected.has(id) ? selected.delete(id) : selected.add(id); renderList(); updateBar(); }
      else openClip(id);
    });
    updateBar();
  }
  function updateBar() {
    const on = screen === "list" && selecting;
    $("#actionbar").hidden = !on;
    $("#selectbtn").textContent = selecting ? "Done" : "Select";
    $("#act-del").textContent = `Delete${selected.size ? " (" + selected.size + ")" : ""}`;
    $("#act-del").disabled = !selected.size;
    $("#act-top").textContent = selected.size >= 2 ? `🏆 Top ${Math.min(10, selected.size)} of these` : "🏆 Top 10 (pick 2+)";
    $("#act-top").disabled = selected.size < 2;
  }
  $("#selectbtn").onclick = () => { selecting = !selecting; if (!selecting) selected.clear(); renderList(); };
  $("#act-del").onclick = async () => {
    const n = selected.size;
    if (!n || !confirm(`Delete ${n} clip${n > 1 ? "s" : ""}? They go to Deleted clips on your PC, where you can restore them.`)) return;
    try { await api("/lib/clip/delete", { ids: [...selected] }); } catch (e) { return toast(e.message); }
    selected.clear(); selecting = false; toast(`Deleted ${n} clip${n > 1 ? "s" : ""}`); showList();
  };
  $("#act-top").onclick = () => openTop([...selected].slice(0, 10));

  // ---------------------------------------------------------------- one clip: post it
  async function openClip(id) {
    let c;
    try { c = await api("/lib/clip?id=" + encodeURIComponent(id)); } catch (e) { return toast(e.message); }
    current = c; go("clip");
    heading.textContent = c.streamer_name || c.streamer || "Clip";
    const fname = c.name + ".mp4";
    const dl = withKey(c.video) + "&download=1&name=" + encodeURIComponent(fname);
    const coverDl = withKey(c.cover) + "&download=1&name=" + encodeURIComponent(c.name + " cover.jpg");
    view.innerHTML = `
      <video class="player" src="${esc(withKey(c.video))}" controls playsinline preload="metadata" poster="${esc(withKey(c.thumb))}"></video>
      ${c.hook ? `<div class="title">${esc(c.hook)}</div>` : ""}
      <div class="muted small">${esc(c.streamer_name || c.streamer)} · ${esc(c.date)} ${esc(c.time)}</div>
      ${platforms.map(p => {
        const cap = c.post[p.key] || {}, done = !!c.posted_at[p.key];
        return `<section class="platform ${done ? "posted" : ""}" data-p="${p.key}">
          <h2><span class="badge" style="background:${COLORS[p.key] || "var(--accent)"}"></span>${esc(p.name)}
            <span class="state">${done ? "Posted ✓" : "Not posted"}</span></h2>
          <div class="row">${canShareFiles
            ? `<button class="btn primary" data-act="share">Share to ${esc(p.name.split(" ")[0])}</button>`
            : `<a class="btn primary" data-act="save" href="${esc(dl)}" download="${esc(fname)}">Save video</a>`}</div>
          ${p.key === "youtube"
            ? `<div class="label">Title</div><textarea class="caption" data-f="title" rows="2">${esc(cap.title)}</textarea>
               <div class="row"><button class="btn" data-act="copy" data-f="title">Copy title</button></div>
               <div class="label">Description</div><textarea class="caption" data-f="description" rows="4">${esc(cap.description)}</textarea>
               <div class="row"><button class="btn" data-act="copy" data-f="description">Copy description</button></div>`
            : `<div class="label">Caption</div><textarea class="caption" data-f="caption" rows="5">${esc(cap.caption)}</textarea>
               <div class="row"><button class="btn" data-act="copy" data-f="caption">Copy caption</button></div>`}
          <ol class="steps">${(STEPS[p.key] || []).map(s => `<li>${esc(s)}</li>`).join("")}</ol>
          <div class="row" style="margin-top:10px"><button class="btn ${done ? "good" : ""}" data-act="mark">${done ? "✓ Posted" : "Mark as posted"}</button></div>
        </section>`; }).join("")}
      <div class="row" style="margin-top:14px">
        <a class="btn" href="${esc(coverDl)}" download="${esc(c.name)} cover.jpg">Save cover image</a>
        <button class="btn danger" id="del1">Delete clip</button></div>
      ${canShareFiles ? "" : `<div class="note">${isIOS ? "On iPhone, Save video puts it in the Files app: open it there, tap Share → Save Video, then pick it in the app."
                                                     : "Save video puts it in your Downloads, where the apps can pick it."} The caption is copied at the same time.</div>`}
      <div class="pad-bottom"></div>`;
    view.querySelectorAll(".platform").forEach(sec => {
      const key = sec.dataset.p;
      const val = f => sec.querySelector(`textarea[data-f="${f}"]`).value;
      const first = () => val(key === "youtube" ? "title" : "caption");
      sec.querySelectorAll("textarea").forEach(ta => ta.onchange = async () => {   // your edits are kept for this clip
        const fields = {}; sec.querySelectorAll("textarea").forEach(x => fields[x.dataset.f] = x.value);
        try { await api("/lib/clip/post-captions", { id: c.id, post: { [key]: fields } }); toast("Saved"); } catch (e) { toast(e.message); }
      });
      sec.querySelectorAll("[data-act]").forEach(btn => btn.onclick = async () => {
        const act = btn.dataset.act;
        if (act === "copy") {
          toast(await copyText(val(btn.dataset.f)) ? "Copied. Paste it in " + key : "Couldn't copy: press and hold the text to copy it");
        } else if (act === "save") {
          copyText(first()).then(ok => ok && toast("Saving the video. " + (key === "youtube" ? "Title" : "Caption") + " copied too.", 3500));
        } else if (act === "share") {
          const file = fileCache[c.id];
          if (!file) return toast("Still getting the video, one moment…");
          const copied = await copyText(first());
          try { await navigator.share({ files: [file] });
                toast((copied ? "Caption copied: paste it, " : "") + "then tap Mark as posted", 4000); }
          catch (e) { if (e && e.name !== "AbortError") toast("Sharing didn't work: try again"); }
        } else if (act === "mark") {
          const now = !sec.classList.contains("posted");
          try { await api("/lib/clip/posted", { id: c.id, platform: key, posted: now }); } catch (e) { return toast(e.message); }
          sec.classList.toggle("posted", now);
          sec.querySelector(".state").textContent = now ? "Posted ✓" : "Not posted";
          btn.textContent = now ? "✓ Posted" : "Mark as posted"; btn.classList.toggle("good", now);
          c.posted_at[key] = now ? "now" : undefined;
          if (platforms.every(p => c.posted_at[p.key])) {
            api("/lib/clip/finish", { id: c.id }).catch(() => {});
            toast("Posted everywhere ✓", 2500);
          }
        }
      });
    });
    $("#del1").onclick = async () => {
      if (!confirm("Delete this clip? It goes to Deleted clips on your PC, where you can restore it.")) return;
      try { await api("/lib/clip/delete", { ids: [c.id] }); } catch (e) { return toast(e.message); }
      toast("Deleted"); history.back();
    };
    if (canShareFiles && !fileCache[c.id]) {
      const btns = () => view.querySelectorAll('[data-act="share"]');
      btns().forEach(b => { b.disabled = true; b.dataset.label = b.textContent; b.textContent = "Getting video…"; });
      try {
        const blob = await (await fetch(withKey(c.video))).blob();
        fileCache = { [c.id]: new File([blob], fname, { type: blob.type || "video/mp4" }) };
      } catch (e) { toast("Couldn't load the video from your PC"); }
      if (current && current.id === c.id) btns().forEach(b => { b.disabled = false; b.textContent = b.dataset.label; });
    }
  }

  // ---------------------------------------------------------------- Top 10 editor
  async function openTop(ids, count = 10) {
    let plan;
    try { plan = await api(`/lib/compilation/plan?count=${count}&ids=${encodeURIComponent(ids.join(","))}`); }
    catch (e) { return toast(e.message, 4000); }
    if (plan.items.length < 2) return toast("Not enough clips from the last 24 hours yet (it needs at least 2)", 4000);
    comp = { ids, items: plan.items, title: plan.title, split: plan.items.length >= 6 };
    go("top"); renderTop();
  }
  function renderTop() {
    const n = comp.items.length, split = comp.split && n >= 4, top = Math.floor(n / 2) + n % 2;
    heading.textContent = `🏆 Top ${n}`;
    const fmt = s => (Math.round(s * 10) / 10).toFixed(1);
    view.innerHTML = `
      ${comp.ids.length ? "" : `<div class="tabs"><button data-n="5" class="${n <= 5 ? "on" : ""}">Top 5</button><button data-n="10" class="${n > 5 ? "on" : ""}">Top 10</button></div>`}
      <div class="label">Title</div><input class="text" id="tp-title" value="${esc(comp.title)}" maxlength="90">
      <label class="switchrow"><input type="checkbox" id="tp-split" ${split ? "checked" : ""} ${n < 4 ? "disabled" : ""}>
        Split into 2 videos (#${n}–#${top + 1}, then #${top}–#1)</label>
      <div class="note">#1 is where chat jumped most. Play a moment and tap "Here" to set where it starts and ends. ▲▼ change the rank, ✕ leaves it out.</div>
      ${comp.items.map((it, i) => `
        ${split && (i === 0 || i === top) ? `<div class="parthead">${i === 0 ? "Part 2 (posted second)" : "Part 1 (posted first)"}</div>` : ""}
        <div class="moment" data-i="${i}">
          <div class="top"><div class="rank">#${i + 1}</div><div><b>${esc(it.name)}</b><div class="muted small">${esc(it.hook || "")}</div></div>
            <div class="moves"><button class="btn" data-mv="-1" ${i === 0 ? "disabled" : ""}>▲</button><button class="btn" data-mv="1" ${i === n - 1 ? "disabled" : ""}>▼</button><button class="btn" data-rm>✕</button></div></div>
          <video src="${esc(withKey(it.video))}#t=${it.start}" controls playsinline preload="metadata"></video>
          <div class="times">
            <span class="muted small">Start</span><input type="number" inputmode="decimal" step="0.5" data-k="start" value="${fmt(it.start)}"><button class="btn" data-here="start">Here</button>
            <span class="muted small">End</span><input type="number" inputmode="decimal" step="0.5" data-k="end" value="${fmt(it.end)}"><button class="btn" data-here="end">Here</button>
          </div>
          <div class="row" style="margin-top:8px"><button class="btn" data-play>▶ Play this part (${fmt(it.end - it.start)} s)</button></div>
        </div>`).join("")}
      <div class="finish"><button class="btn primary" id="tp-make">Make it</button></div>
      <div class="pad-bottom"></div>`;
    view.querySelectorAll("[data-n]").forEach(b => b.onclick = () => openTop([], +b.dataset.n));
    $("#tp-title").oninput = e => comp.title = e.target.value;
    $("#tp-split").onchange = e => { comp.split = e.target.checked; renderTop(); };
    view.querySelectorAll(".moment").forEach(row => {
      const i = +row.dataset.i, it = comp.items[i], v = row.querySelector("video");
      const set = (k, val) => {
        val = Math.max(0, Math.min(it.length, Number(val) || 0));
        if (k === "start") it.start = Math.min(val, it.end - 1); else it.end = Math.max(val, it.start + 1);
        renderTop();
      };
      row.querySelectorAll("input[data-k]").forEach(inp => inp.onchange = () => set(inp.dataset.k, inp.value));
      row.querySelectorAll("[data-here]").forEach(b => b.onclick = () => set(b.dataset.here, v.currentTime));
      row.querySelector("[data-play]").onclick = () => {
        v.currentTime = it.start; v.play();
        const stop = () => { if (v.currentTime >= it.end) { v.pause(); v.removeEventListener("timeupdate", stop); } };
        v.addEventListener("timeupdate", stop);
      };
      row.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => {
        const j = i + +b.dataset.mv; [comp.items[i], comp.items[j]] = [comp.items[j], comp.items[i]]; renderTop();
      });
      row.querySelector("[data-rm]").onclick = () => {
        if (comp.items.length <= 2) return toast("A countdown needs at least 2 moments");
        comp.items.splice(i, 1); renderTop();
      };
    });
    $("#tp-make").onclick = makeTop;
  }
  async function makeTop() {
    const split = comp.split && comp.items.length >= 4, n = comp.items.length;
    let r;
    try { r = await api("/lib/compilation", { items: comp.items.map(it => ({ id: it.id, start: it.start, end: it.end })),
                                               title: comp.title, split, schedule: false }); }
    catch (e) { return toast(e.message, 5000); }
    stopVideos(); selected.clear(); selecting = false;
    history.back();
    toast(`Making your Top ${n}${split ? " (2 videos)" : ""}… it shows up under "Top moments" in a few minutes`, 5000);
    for (;;) {
      await new Promise(res => setTimeout(res, 4000));
      const j = await api("/lib/job?id=compilation").catch(() => ({ state: "running" }));
      if (j.state === "running") continue;
      if (j.state === "error") return toast("Couldn't make it: " + j.error, 7000);
      toast(`🏆 Your Top ${n} is ready`, 4000); streamer = "Top moments"; tab = "todo"; return showList();
    }
  }

  // ---------------------------------------------------------------- wiring
  $("#refresh").onclick = () => screen === "clip" && current ? openClip(current.id) : screen === "list" ? showList() : null;
  setInterval(() => { if (screen === "list" && !selecting && document.visibilityState === "visible") showList(); }, 10000);
  document.addEventListener("visibilitychange", () => { if (screen === "list" && document.visibilityState === "visible") showList(); });
  go("list", false);
  showList();
})();
</script>
</body>
</html>
