<!doctype html><meta charset="utf-8"><title>fake Instagram</title>
<!-- Stand-in for Instagram's web "Create" flow: Create -> Post -> file input in a dialog ->
     "now shared as reels" OK -> Next (crop) -> Next (edit) -> caption box. -->
<a href="#" id="create"><svg aria-label="New post" width="24" height="24"><rect width="24" height="24"/></svg></a>
<div id="menu" hidden><a href="#" id="postitem"><svg aria-label="Post" width="20" height="20"><circle cx="10" cy="10" r="9"/></svg></a></div>
<div role="dialog" id="dlg" hidden>
  <input type="file" id="f" style="display:none">
  <div id="reels" hidden>Video posts are now shared as reels <button id="ok">OK</button></div>
  <div id="coverpane" hidden>Cover photo <div role="button" id="pickcover" tabindex="0">Select from computer</div>
    <input type="file" accept="image/jpeg,image/png" id="coverin" style="display:none"></div>
  <div id="croptools" hidden><div role="button" tabindex="0" id="cropbtn"><svg aria-label="Select crop" width="16" height="16"><rect width="16" height="16"/></svg></div>
    <div id="cropmenu" hidden><div role="button" tabindex="0" id="orig">Original <svg aria-label="Photo outline icon" width="8" height="8"></svg></div>
      <div role="button" tabindex="0">1:1</div><div role="button" tabindex="0">4:5</div></div></div>
  <div role="button" id="next" hidden tabindex="0">Next</div>
  <div id="capwrap" hidden><div aria-label="Write a caption..." contenteditable="true" id="cap"></div><div role="button" id="share" tabindex="0">Share</div></div>
  <div id="shared" hidden>Your reel has been shared.</div>
</div>
<script>
let stage = 0;
create.onclick = e => { e.preventDefault(); menu.hidden = false; };
postitem.onclick = e => { e.preventDefault(); menu.hidden = true; dlg.hidden = false; };
f.onchange = () => { window.__file = f.files[0].name; reels.hidden = false; };
window.__shape = "1:1";   // Instagram starts on a square
ok.onclick = () => { reels.hidden = true; next.hidden = false; croptools.hidden = false; };
cropbtn.onclick = () => cropmenu.hidden = false;
orig.onclick = () => { window.__shape = "original"; cropmenu.hidden = true; };
next.onclick = () => { stage++; window.__nexts = stage; coverpane.hidden = stage !== 1; croptools.hidden = true;
  if (stage >= 2) { next.hidden = true; capwrap.hidden = false; } };
pickcover.onclick = () => coverin.click();
coverin.onchange = () => window.__cover = coverin.files[0].name;
share.onclick = () => { window.__posted = true; capwrap.hidden = true; setTimeout(() => shared.hidden = false, 1500); };
</script>
